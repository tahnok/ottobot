[project]
name = "ottobot"
version = "0.1.0"
description = "An Ottawa mesh bot for MeshCore networks, with community-contributed commands"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "meshcore>=2.3.17",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-sdk>=1.30",
    "tzdata>=2026.6",
]

[project.scripts]
ottobot = "ottobot.cli:main"

[dependency-groups]
dev = [
    "black>=25",
    "hypothesis>=6.170.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ty>=0.0.95",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.black]
target-version = ["py313"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
# Any warning fails the run, so leaks like an unclosed sqlite connection (a
# ResourceWarning) get fixed rather than scrolling past.
filterwarnings = ["error"]
# Tests that hit the real upstream APIs run only on request (`pytest -m live`,
# as .github/workflows/live-apis.yml does), so a flaky upstream can't block CI.
addopts = "-m 'not live'"
markers = ["live: hits real upstream APIs; deselected unless asked for"]

# Coverage is opt-in (`uv run pytest --cov`, as CI does) so running a single
# test file locally doesn't trip the floor below.
[tool.coverage.run]
source = ["ottobot"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
